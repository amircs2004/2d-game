<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="64" height="32" shape-rendering="crispEdges">
  <!-- Frame 0: Closed Door (X: 0 to 32) -->
  <g transform="translate(0, 0)">
    <rect x="8" y="3" width="16" height="27" rx="2" fill="#b87333" stroke="#2b1504" stroke-width="2"/>
    <rect x="10" y="5" width="12" height="23" fill="#c68b59"/>
    <rect x="10" y="16" width="3" height="3" fill="#1a0d02"/>
    <rect x="7" y="29" width="18" height="2" fill="#8c531e"/>
  </g>

  <!-- Frame 1: Open Door (X: 32 to 64) -->
  <g transform="translate(32, 0)">
    <rect x="8" y="3" width="16" height="27" fill="#111111" stroke="#2b1504" stroke-width="2"/>
    <polygon points="8,3 16,5 16,27 8,29" fill="#9e5b22" stroke="#2b1504" stroke-width="1.5"/>
    <rect x="7" y="29" width="18" height="2" fill="#8c531e"/>
  </g>
</svg>
